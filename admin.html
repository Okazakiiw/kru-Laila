<body class="admin">
  <a class="skip" href="#main">ข้ามไปเนื้อหา</a>

  <!-- Login (Firebase Auth) -->
  <div id="loginBox" class="login-wrap" hidden>
    <main class="card login" aria-labelledby="loginH">
      <div class="logo" aria-hidden="true">ค</div>
      <div>
        <h1 id="loginH">เข้าสู่ระบบแอดมิน</h1>
        <p class="label" style="margin-top:6px">ครูไลลาขายบ้านและที่ดิน</p>
      </div>
      <form id="loginForm" class="fgrid" style="text-align:left" novalidate>
        <div class="field"><label for="loginEmail">อีเมล</label><input id="loginEmail" class="input" type="email" autocomplete="username" placeholder="admin@example.com" required /></div>
        <div class="field"><label for="loginPass">รหัสผ่าน</label><input id="loginPass" class="input" type="password" autocomplete="current-password" placeholder="••••••••" required /></div>
        <button id="loginBtn" class="btn btn-lg btn-block" type="submit">เข้าสู่ระบบ</button>
        <button id="forgotBtn" class="btn btn-soft btn-block" type="button">ลืมรหัสผ่าน</button>
      </form>
      <p class="label fine">
        ต้องสร้างบัญชีแอดมินใน Firebase Console → Authentication → Users ก่อนใช้งาน
        และเพิ่ม UID ของบัญชีนั้นใน Firestore → <code>admins/{UID}</code> ตาม <code>firestore.rules</code> (ดู README)
      </p>
      <a class="btn btn-soft" href="index.html"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg>กลับหน้าเว็บ</a>
    </main>
  </div>

  <!-- ส่วนหลังล็อกอิน -->
  <div id="adminBox" hidden>
    <aside class="rail" aria-label="เมนูแอดมิน">
      <a href="#/overview" class="rail-logo" aria-label="ครูไลลา แอดมิน">ค</a>
      <nav aria-label="เมนูแอดมิน">
        <a href="#/overview" data-nav="overview" data-tip="ภาพรวม" aria-label="ภาพรวม"><svg class="ic" aria-hidden="true"><use href="#i-dashboard"/></svg></a>
        <a href="#/listings" data-nav="listings" data-tip="ประกาศ" aria-label="ประกาศ"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg></a>
        <button type="button" class="rail-plus" data-action="new" data-tip="เพิ่มประกาศ" aria-label="เพิ่มประกาศ"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <a href="#/leads" data-nav="leads" data-tip="ลูกค้าที่สนใจ" aria-label="ลูกค้าที่สนใจ"><svg class="ic" aria-hidden="true"><use href="#i-inbox"/></svg><span class="nav-badge" data-leads-badge hidden></span></a>
        <a href="#/types" data-nav="types" data-tip="ประเภท" aria-label="ประเภท"><svg class="ic" aria-hidden="true"><use href="#i-tag"/></svg></a>
        <a href="#/settings" data-nav="settings" data-tip="ตั้งค่า" aria-label="ตั้งค่า"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg></a>
      </nav>
      <div class="rail-bottom">
        <a href="index.html" target="_blank" rel="noopener" data-tip="ดูหน้าเว็บ" aria-label="ดูหน้าเว็บ (แท็บใหม่)"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg></a>
        <button type="button" id="logoutBtn" data-tip="ออกจากระบบ" aria-label="ออกจากระบบ"><svg class="ic" aria-hidden="true"><use href="#i-log-out"/></svg></button>
      </div>
    </aside>

    <div class="shell">
      <main id="main" tabindex="-1"></main>
    </div>

    <nav class="bbar admin-bbar" aria-label="เมนูแอดมิน (มือถือ)">
      <a href="#/overview" data-nav="overview"><svg class="ic" aria-hidden="true"><use href="#i-dashboard"/></svg>ภาพรวม</a>
      <a href="#/listings" data-nav="listings"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg>ประกาศ</a>
      <button type="button" class="bbar-plus" data-action="new" aria-label="เพิ่มประกาศ"><span><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></span></button>
      <a href="#/leads" data-nav="leads"><svg class="ic" aria-hidden="true"><use href="#i-inbox"/></svg>ลูกค้า<span class="nav-badge" data-leads-badge hidden></span></a>
      <a href="#/types" data-nav="types"><svg class="ic" aria-hidden="true"><use href="#i-tag"/></svg>ประเภท</a>
      <a href="#/settings" data-nav="settings"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg>ตั้งค่า</a>
    </nav>
  </div>

  <div id="toastWrap" class="toast-wrap" role="status" aria-live="polite"></div>
